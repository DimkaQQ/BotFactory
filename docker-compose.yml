services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-botfactory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botfactory}
      POSTGRES_DB: ${POSTGRES_DB:-botfactory}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-botfactory}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: alembic upgrade head
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"  # loopback only: nginx/Caddy is the way in
    volumes:
      # Directly-uploaded media (Settings.media_upload_dir, relative to the
      # image's /srv WORKDIR) — a named volume so uploads survive a
      # redeploy instead of vanishing with the container's writable layer.
      - media_uploads:/srv/media_uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python -m meta_bot.main
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  db_data:
  media_uploads:

networks:
  # Some VPS/cloud hosts have a real interface MTU below Docker's default
  # bridge MTU of 1500 (overlay/SDN networks are the usual cause) — that
  # mismatch silently drops large packets like TLS handshakes, which shows
  # up as containers timing out on HTTPS calls (e.g. to api.telegram.org)
  # while small requests work fine. Override via DOCKER_NETWORK_MTU in
  # .env if `ip link show <default-iface>` reports something other than
  # 1500; leave unset otherwise.
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "${DOCKER_NETWORK_MTU:-1500}"
