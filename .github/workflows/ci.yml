name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: botfactory
          POSTGRES_PASSWORD: botfactory
          POSTGRES_DB: botfactory
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U botfactory"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://botfactory:botfactory@localhost:5432/botfactory
      DATABASE_URL_SYNC: postgresql+psycopg2://botfactory:botfactory@localhost:5432/botfactory
      META_BOT_TOKEN: "123456:AAAA-ci"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ключ шифрования для тестов
        run: echo "FERNET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - run: ruff check app meta_bot tests
      - run: alembic upgrade head
      - run: pytest --cov --cov-report=term-missing:skip-covered

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Уязвимые зависимости
        run: pip-audit -r requirements.txt
      - name: Статический анализ безопасности
        # MD5/SHA1 нужны провайдерам по их протоколам (usedforsecurity=False);
        # уровень medium и выше — остальное шум.
        run: bandit -q -r app meta_bot -ll

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
