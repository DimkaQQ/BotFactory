# Example vhost for a VPS where nginx already runs on the host (see
# docker-compose.shared-vps.yml). Copy this to
# /etc/nginx/sites-available/botfactory.conf, replace your-domain.com,
# symlink it into sites-enabled, then let certbot add TLS:
#
#   sudo cp deploy/nginx-vhost.example.conf /etc/nginx/sites-available/botfactory.conf
#   sudo nano /etc/nginx/sites-available/botfactory.conf   # set your real domain
#   sudo ln -s /etc/nginx/sites-available/botfactory.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d your-domain.com
#
# certbot rewrites just this file to add the SSL server block + redirect —
# it does not touch any of the other vhosts already on the box.

# Ограничение частоты на входе: здесь настоящий адрес клиента виден напрямую.
limit_req_zone $binary_remote_addr zone=bf_front:10m rate=30r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # Default 1m is too small for a direct media upload — see
    # nginx/default.conf (the container's own nginx has the same setting;
    # this host-level vhost is another hop in front of it on this deploy
    # flavor, so it needs the bump too).
    client_max_body_size 25m;

    # Baseline hardening. The app renders no user HTML of its own, but media
    # and the server-rendered payment pages are served from this origin and
    # the web session token lives in localStorage here — so a sniffed
    # content type or a framed page is worth refusing outright.
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        limit_req zone=bf_front burst=80 nodelay;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
