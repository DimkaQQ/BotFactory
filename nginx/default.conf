server {
    listen 80;
    server_name _;

    # The web app (constructor + dashboard) is served at the root — it's the
    # primary product now, not just a Mini App riding along under a subpath.
    # /builder is kept as a redirect for anything still pointing at the old URL.
    root /usr/share/nginx/html;
    index index.html;

    location = /builder {
        return 301 /;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhook/ {
        proxy_pass http://api:8000/webhook/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
