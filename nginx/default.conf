# Ограничение частоты. Зоны живут на уровне http (этот файл подключается из
# conf.d), поэтому объявляются до server. Ключ — настоящий адрес клиента: за
# Caddy или внешним nginx $remote_addr был бы адресом прокси, и один лимит
# делили бы все посетители сразу — см. set_real_ip_from ниже.
limit_req_zone $binary_remote_addr zone=bf_login:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=bf_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=bf_pay:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    server_tokens off;

    # API может работать в нескольких экземплярах (docker compose --scale) и
    # обновляться по одному, поэтому адрес api не вшивается при старте nginx:
    # имя переразрешается каждые 5 секунд, а запрос уходит по кругу на все
    # живые экземпляры. С переменной в proxy_pass путь передаётся как есть.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $bf_api http://api:8000;
    proxy_connect_timeout 3s;
    # Экземпляр, который в эту секунду перезапускается, — не причина ошибки
    # для покупателя: запрос повторяется на соседнем.
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 3;

    # Доверяем X-Forwarded-For только от своих (docker-сети, loopback, LAN):
    # от остальных заголовок подделывается одной строкой, а с ним и лимит.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Default 1m is too small for a direct media upload (see
    # app/routers/media.py / Settings.media_max_upload_mb) — a little
    # headroom above that cap for multipart overhead.
    client_max_body_size 25m;

    # The web app (constructor + dashboard) is served at the root — it's the
    # primary product now, not just a Mini App riding along under a subpath.
    # /builder is kept as a redirect for anything still pointing at the old URL.

    # Baseline hardening. The app renders no user HTML of its own, but media
    # and the server-rendered payment pages are served from this origin and
    # the web session token lives in localStorage here — so a sniffed
    # content type or a framed page is worth refusing outright.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    location = /builder {
        return 301 /;
    }

    # Файлы сборки имеют хеш в имени — их можно кэшировать навсегда.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # CSP пока в режиме «только отчёт»: браузер пишет нарушения в консоль, но
    # ничего не блокирует. Так политику можно проверить на живом сайте, не рискуя
    # сломать вход или предпросмотр; убедившись, что в консоли чисто, замени
    # Content-Security-Policy-Report-Only на Content-Security-Policy.
    # Политика только у приложения: страницы оплаты и документов, которые отдаёт
    # api, держат собственные инлайн-стили и под эту политику не подходят.
    # Фрейминг не запрещаем намеренно — Mini App открывается в iframe веб-
    # клиента Telegram.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https:; font-src 'self' data:; connect-src 'self'; frame-src https://oauth.telegram.org; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    # Вход: подбирать нечего, но и дёргать проверку подписи в цикле незачем.
    # Состояние сервиса вместе с базой — для сторожа и внешнего аптайм-монитора.
    # Без этого правила запрос уходил бы в SPA и всегда отвечал 200.
    location = /health {
        proxy_pass $bf_api;
        proxy_set_header Host $host;
    }

    location /api/auth/ {
        limit_req zone=bf_login burst=10 nodelay;
        proxy_pass $bf_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=bf_api burst=60 nodelay;
        proxy_pass $bf_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Оферта и политика — страницы приложения, а не SPA: без этого
    # try_files отдавал бы на них index.html, и ссылка из подвала
    # открывала бы конструктор вместо документа.
    location /legal/ {
        proxy_pass $bf_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Форма «Пожаловаться на бота» — страница приложения, а не SPA.
    location = /report {
        limit_req zone=bf_api burst=10 nodelay;
        proxy_pass $bf_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Уведомления платёжных систем: каждое открывает запрос в API провайдера,
    # так что поток мусора сюда дорог. Ограничение щедрое — провайдеры
    # ретраят пачками, но не сотнями в секунду.
    location /webhook/pay/ {
        limit_req zone=bf_pay burst=40 nodelay;
        proxy_pass $bf_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Апдейты Telegram идут с его адресов потоком и подписаны секретом —
    # лимит по IP здесь навредил бы, а не помог.
    location /webhook/ {
        proxy_pass $bf_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
