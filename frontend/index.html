    <!-- Скрипт Telegram нужен только внутри Mini App, и там он обязан быть готов до старта
         приложения (синхронно). В обычном браузере он не ждёт: раньше медленный telegram.org
         откладывал первую отрисовку лендинга на секунды. -->
    <script>
      (function () {
        var inTelegram =
          /tgWebApp/.test(location.hash + location.search) ||
          !!window.TelegramWebviewProxy ||
          /Telegram/i.test(navigator.userAgent);
        var src = "https://telegram.org/js/telegram-web-app.js";
        if (inTelegram) {
          document.write('<script src="' + src + '"><\/script>');
        } else {
          var s = document.createElement("script");
          s.src = src;
          s.async = true;
          document.head.appendChild(s);
        }
      })();
    </script>
    <!-- Resolve the theme before the first paint. The palette in index.css
         is keyed on this attribute alone (see src/theme.ts), so without it
         the page would flash light and then correct itself once the React
         bundle mounted. Deliberately tiny and dependency-free: it has to
         run synchronously, ahead of everything. -->
    <script>
      (function () {
        var theme = "dark";
        try {
          var stored = localStorage.getItem("bf_theme");
          var tg = window.Telegram && window.Telegram.WebApp;
          theme =
            stored === "light" || stored === "dark"
              ? stored
              : tg && tg.colorScheme === "light"
                ? "light"
                : "dark";
        } catch (e) {
          /* Private-mode localStorage — тёмная тема по умолчанию. */
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
