<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Bot Factory — конструктор</title>
    <meta name="description" content="Собирай Telegram-ботов визуально — без кода. Живой превью чата, готовые сценарии, публикация за 2 минуты." />
    <meta name="theme-color" content="#4338ca" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bot Factory" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234338ca'/%3E%3Ctext x='32' y='42' font-size='32' text-anchor='middle'%3E%F0%9F%8F%AD%3C/text%3E%3C/svg%3E"
    />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Resolve the theme before the first paint. The palette in index.css
         is keyed on this attribute alone (see src/theme.ts), so without it
         the page would flash light and then correct itself once the React
         bundle mounted. Deliberately tiny and dependency-free: it has to
         run synchronously, ahead of everything. -->
    <script>
      (function () {
        var theme = "light";
        try {
          var stored = localStorage.getItem("bf_theme");
          var tg = window.Telegram && window.Telegram.WebApp;
          theme =
            stored === "light" || stored === "dark"
              ? stored
              : (tg && tg.colorScheme) ||
                (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        } catch (e) {
          /* Private-mode localStorage, ancient matchMedia — light is a safe floor. */
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
