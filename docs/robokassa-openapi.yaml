  /Merchant/WebService/Service.asmx/OpStateExt:
    get:
      tags:
        - Operations
      summary: Получить расширенную информацию об операции
      description: |
        Возвращает состояние оплаты и реквизиты операции. Метод работает только
        в основном режиме и не возвращает тестовые платежи с `IsTest=1`.

        Подпись рассчитывается по формуле
        `MerchantLogin:InvoiceID:Пароль#2`.
      operationId: getOperationState
      x-robokassa-authentication:
        type: request-signature
        required: true
      x-robokassa-signature:
        parameter: Signature
        password: Пароль#2
        formula: MerchantLogin:InvoiceID:Пароль#2
        documentation: https://docs.robokassa.ru/ru/xml-interfaces#checking-operation-status
      servers:
        - url: https://auth.robokassa.ru
      parameters:
        - $ref: "#/components/parameters/MerchantLogin"
        - name: InvoiceID
          in: query
          required: true
          description: Номер счета магазина.
          schema:
            type: integer
            format: int64
        - name: Signature
          in: query
          required: true
          description: Контрольная сумма в шестнадцатеричном формате.
          schema:
            type: string
            pattern: "^[0-9A-Fa-f]+$"
      responses:
        "200":
          description: |
            Результат запроса. Прикладные ошибки передаются с HTTP 200 в
            `Result.Code` и `Result.Description`.
          content:
            text/xml:
              schema:
                $ref: "#/components/schemas/OperationStateResponse"
              examples:
                success:
                  summary: Структура успешного ответа
                  value: |
                    <OperationStateResponse>
                      <Result><Code>0</Code></Result>
                      <State>
                        <Code>100</Code>
                        <RequestDate>2026-07-22T10:00:00+03:00</RequestDate>
                        <StateDate>2026-07-22T09:59:00+03:00</StateDate>
                      </State>
                    </OperationStateResponse>
                operationNotFound:
                  summary: Операция не найдена
                  value: |
                    <OperationStateResponse xmlns="http://merchant.roboxchange.com/WebService/">
                      <Result>
                        <Code>3</Code>
                        <Description>Не удалось найти операцию</Description>
                      </Result>
                    </OperationStateResponse>
        default:
          description: Транспортная ошибка XML-интерфейса.
      x-robokassa-environment:
        testSupported: false
        productionSupported: true
        note: Метод возвращает состояние только основных операций; тестовые операции не отображаются.

  /Merchant/WebService/Service.asmx/GetCurrencies:
    get:
      tags:
        - Reference
      summary: Получить доступные способы оплаты
      description: |
        Возвращает способы оплаты, доступные магазину. Список и ограничения
        зависят от настроек конкретного магазина.
      operationId: getCurrencies
      x-robokassa-authentication:
        type: none
        required: false
        reason: Справочный метод принимает MerchantLogin без контрольной суммы.
      servers:
        - url: https://auth.robokassa.ru
      parameters:
        - $ref: "#/components/parameters/MerchantLogin"
        - name: Language
          in: query
          required: false
          description: Язык названий способов оплаты.
          schema:
            type: string
            enum:
              - ru
              - en
      responses:
        "200":
          description: |
            Результат запроса. Прикладные ошибки передаются с HTTP 200 в
            `Result.Code` и `Result.Description`.
          content:
            text/xml:
              schema:
                $ref: "#/components/schemas/CurrenciesList"
              examples:
                success:
                  value: |
                    <CurrenciesList xmlns="http://merchant.roboxchange.com/WebService/">
                      <Result><Code>0</Code></Result>
                      <Groups>
                        <Group Code="BankCard" Description="Банковской картой">
                          <Items>
                            <Currency Label="BankCardPSR" Alias="BankCard" Name="Банковская карта" />
                          </Items>
                        </Group>
                      </Groups>
                    </CurrenciesList>
        default:
          description: Транспортная ошибка XML-интерфейса.
      x-robokassa-environment:
        testSupported: false
        productionSupported: true
        note: Метод справочный и не имеет отдельного тестового режима.

  /RefundService/Refund/Create:
    post:
      tags:
        - Refunds
      summary: Создать заявку на возврат
      description: |
        Создает полный или частичный возврат по завершенной операции. Тело — JWT,
        подписанный `Password3` алгоритмом HS256, HS384 или HS512.

        Метод требует предварительного подключения API возвратов для магазина.
        Реальный успешный возврат в рамках проверки спецификации не выполнялся.
      operationId: createRefund
      x-robokassa-authentication:
        type: jwt
        required: true
      servers:
        - url: https://services.robokassa.ru
      requestBody:
        required: true
        description: |
          В тело запроса передается одна JSON-строка с подписанным JWT:
          `"BASE64URL_HEADER.BASE64URL_PAYLOAD.SIGNATURE"`.

          Состав JWT:
          - Header: JSON с типом токена и алгоритмом подписи, например `{"typ":"JWT","alg":"HS256"}`.
          - Payload: JSON с параметрами возврата по схеме `RefundPayload`.
          - BASE64URL_HEADER: Header после Base64Url-кодирования без padding.
          - BASE64URL_PAYLOAD: Payload после Base64Url-кодирования без padding.
          - Signature: подпись, рассчитанная магазином с использованием `Password3`.
        content:
          application/json:
            schema:
              type: string
              contentMediaType: application/jwt
              description: Подписанный JWT, переданный как JSON-строка, а не как JSON-объект.
              pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
      responses:
        "200":
          description: Документированный результат создания заявки.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundCreateResponse"
        "400":
          description: Некорректный JWT или невалидная подпись JWT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundCreateResponse"
              examples:
                badRequest:
                  value:
                    success: false
                    message: BadRequest
                    requestId: null
                signatureVerificationFailed:
                  value:
                    success: false
                    message: signature verification has been failed
                    requestId: null
        "401":
          description: Неверный Password3 или API возвратов не подключен магазину.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundCreateResponse"
              example:
                success: false
                message: Signature key is not exists or partner have not access to API
                requestId: null
        default:
          description: Транспортная ошибка Refund API.
      x-robokassa-jwt:
        payloadSchema: "#/components/schemas/RefundPayload"
        payloadSchemaRef:
          $ref: "#/components/schemas/RefundPayload"
        password: Password3
        secret: Password3
        signingInput: BASE64URL_HEADER.BASE64URL_PAYLOAD
        signature: HMAC(signingInput, secret)
        documentation: https://docs.robokassa.ru/ru/refund-api#refund-initiation
      x-robokassa-environment:
        testSupported: false
        productionSupported: true
        note: Метод не имеет отдельного тестового режима.

  /RefundService/Refund/GetState:
    get:
      tags:
        - Refunds
      summary: Получить состояние возврата
      operationId: getRefundState
      x-robokassa-authentication:
        type: none
        required: false
        reason: Состояние возврата запрашивается по идентификатору requestId.
      servers:
        - url: https://services.robokassa.ru
      parameters:
        - name: id
          in: query
          required: true
          description: "`requestId`, полученный при создании возврата."
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Документированное состояние возврата.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundState"
        "400":
          description: Идентификатор некорректен или заявка не существует.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"
              example:
                message: Id is invalid or request id does not exist
        default:
          description: Транспортная ошибка Refund API.
      x-robokassa-environment:
        testSupported: false
        productionSupported: true
        note: Метод не имеет отдельного тестового режима.

  /Merchant/Payment/Confirm:
    post:
      tags:
        - Holding
      summary: Подтвердить списание удержанных средств
      description: |
        Завершает двухстадийный платеж в состоянии HOLD. Запрос можно выполнить
        только один раз. Если передан новый `Receipt`, сумма и состав корзины могут
        быть изменены только в меньшую сторону.

        Проверенное поведение:
        - первый вызов для операции в HOLD возвращает HTTP 200 и `"success: true"`;
        - повторный вызов по тому же `InvoiceID` возвращает HTTP 200 и `"success: false"`;
        - повторного списания не происходит;
        - ранее подтвержденная операция остается в состоянии `100`.

        При неоднозначном ответе или `"success: false"` запрещено автоматически
        повторять Confirm. Сначала вызовите OpStateExt.
      operationId: confirmHold
      x-robokassa-authentication:
        type: request-signature
        required: true
      servers:
        - url: https://auth.robokassa.ru
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/HoldConfirmRequest"
      responses:
        "200":
          description: |
            Результат обработки запроса. Значение `"success: true"` означает,
            что запрос принят. `"success: false"` может означать, что операция
            уже была обработана или не может быть выполнена в текущем состоянии.

            При `"success: false"` нельзя автоматически повторять запрос.
            Сначала необходимо проверить состояние операции через OpStateExt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoldActionResponse"
              examples:
                success:
                  value: "success: true"
                rejected:
                  value: "success: false"
        default:
          description: Транспортная ошибка.
      x-robokassa-signature:
        password: Пароль#1
        formulaWithoutReceipt: MerchantLogin:OutSum:InvoiceID:Пароль#1
        formulaWithReceipt: MerchantLogin:OutSum:InvoiceID:Receipt:Пароль#1
        documentation: https://docs.robokassa.ru/ru/holding.html#request
        clientExample: https://github.com/robokassa/cms-wordpress/blob/92c8c6aceffe283f89319ac41ead78bc573bb361/wp_robokassa.php#L1555
      x-robokassa-environment:
        testSupported: false
        productionSupported: true
        note: Тестовый режим не поддерживается. Метод работает только в основном режиме.

  /Merchant/Payment/Cancel:
    post:
      tags:
        - Holding
      summary: Отменить холдирование
      description: |
        Отменяет двухстадийный платеж в состоянии HOLD. `OutSum` передается в
        запросе, но в строке подписи вместо суммы используется пустой сегмент.

        Значение `"success: true"` означает, что запрос принят, но итоговый статус
        необходимо проверить через OpStateExt. HTTP 200 сам по себе не означает
        успешную отмену операции.

        При `"success: false"` запрещено автоматически повторять Cancel.
        Сначала вызовите OpStateExt и проверьте состояние операции.
      operationId: cancelHold
      x-robokassa-authentication:
        type: request-signature
        required: true
      servers:
        - url: https://auth.robokassa.ru
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/HoldCancelRequest"
      responses:
        "200":
          description: |
            Результат обработки запроса. Значение `"success: true"` означает,
            что запрос принят. `"success: false"` может означать, что операция
            уже была обработана или не может быть выполнена в текущем состоянии.

            При `"success: false"` нельзя автоматически повторять запрос.
            Сначала необходимо проверить состояние операции через OpStateExt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoldActionResponse"
              examples:
                success:
                  value: "success: true"
                rejected:
                  value: "success: false"
        default:
          description: Транспортная ошибка.
      x-robokassa-signature:
        password: Пароль#1
        formula: "MerchantLogin::InvoiceID:Пароль#1"
        documentation: https://docs.robokassa.ru/ru/holding.html#cancel
        clientExample: https://github.com/robokassa/cms-wordpress/blob/92c8c6aceffe283f89319ac41ead78bc573bb361/wp_robokassa.php#L1579
      x-robokassa-environment:
        testSupported: false
        productionSupported: true
        note: Тестовый режим не поддерживается. Метод работает только в основном режиме.

  /Merchant/Recurring:
    post:
      tags:
        - Recurring
      summary: Создать повторный платеж
      description: |
        Инициирует дочерний платеж после успешной материнской операции с
        `Recurring=true`. `PreviousInvoiceID` обязателен, но не включается в
        расчет `SignatureValue`.

        Вызов может привести к повторному списанию средств без участия покупателя.
      operationId: createRecurringPayment
      x-robokassa-authentication:
        type: request-signature
        required: true
      servers:
        - url: https://auth.robokassa.ru
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/RecurringPaymentRequest"
      responses:
        "200":
          description: |
            Успешный ответ метода. В теле возвращается строка `OK{InvoiceID}`,
            где `InvoiceID` — номер дочерней операции.
          content:
            text/plain:
              schema:
                type: string
              example: OK156
        "500":
          description: Ошибка обработки рекуррентного платежа.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RecurringProblem"
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.6.1
                title: Internal error
                status: 500
                detail: "Recurring: Internal ERROR occurred"
                instance: Recurring
                traceId: 00-c2f78a888cbc57012f0fd49540ae996b-05591a05035c0377-00
        default:
          description: Транспортная ошибка запуска рекуррентного платежа.
      x-robokassa-signature:
        password: Пароль#1
        note: PreviousInvoiceID не включается в подпись.
        documentation: https://docs.robokassa.ru/ru/recurring-payments#request-parameters
        clientExample: https://github.com/robokassa/cms-wordpress/blob/92c8c6aceffe283f89319ac41ead78bc573bb361/classes/Robokassa/Payment/RobokassaPayAPI.php#L742
      x-robokassa-environment:
        testSupported: false
        productionSupported: true
        note: Тестовый режим не поддерживается. Метод работает только в основном режиме.

  /Merchant/Payment/CoFPayment:
    get:
      tags:
        - Payments
      summary: Открыть платежную страницу для оплаты по сохраненной карте
      description: |
        Создает оплату по сохраненной карте. В параметре `Token` передается
        `OpKey` операции, в которой эта карта уже использовалась.

        Сценарий работает только для исходных операций, проведенных по банковской
        карте. Для операций через pay-сервисы, СБП и BNPL оплата по сохраненной
        карте не поддерживается.
      operationId: createCoFPayment
      x-robokassa-authentication:
        type: request-signature
        required: true
      servers:
        - url: https://auth.robokassa.ru
      parameters:
        - $ref: "#/components/parameters/MerchantLogin"
        - $ref: "#/components/parameters/OutSum"
        - $ref: "#/components/parameters/SignatureValue"
        - $ref: "#/components/parameters/InvId"
        - name: Token
          in: query
          required: true
          description: OpKey операции, карту которой нужно использовать для новой оплаты.
          schema:
            type: string
        - name: Description
          in: query
          description: Название товара или услуги, без специальных символов.
          schema:
            type: string
            maxLength: 100
        - name: Email
          in: query
          description: Email покупателя для чеков и уведомлений.
          schema:
            type: string
            format: email
        - name: Culture
          in: query
          description: Язык платежной страницы.
          schema:
            type: string
            enum:
              - ru
              - en
        - name: Receipt
          in: query
          description: Фискальные данные в URL-кодировке.
          schema:
            type: string
        - name: ResultUrl2
          in: query
          description: Дополнительный адрес серверного уведомления.
          schema:
            type: string
            format: uri
      responses:
        "200":
          description: |
            HTML-страница платежной формы или страница с сообщением об ошибке
            параметров. При неверной подписи код прикладной ошибки передается
            внутри контекста страницы, например `RoboxContext.error.code=29`.
          content:
            text/html:
              schema:
                type: string
        "302":
          description: |
            Запрос обработан. В заголовке `Location` возвращается относительный
            URL платежной страницы. Этот ответ не подтверждает создание или
            оплату операции.
          headers:
            Location:
              description: Относительный URL платежной страницы.
              required: true
              schema:
                type: string
                format: uri-reference
                example: /Merchant/Index/01234567-89ab-4cde-8f01-23456789abcd
        default:
          description: Транспортная ошибка запуска платежа.
      x-robokassa-custom-parameters:
        prefix: Shp_
        description: Пользовательские параметры возвращаются в уведомлениях без изменений.
      x-robokassa-signature:
        parameter: SignatureValue
        password: Пароль#1
        formulaWithOnlyToken: MerchantLogin:OutSum:InvId:Token:Пароль#1
        formulaWithReceiptAndToken: MerchantLogin:OutSum:InvId:Receipt:Token:Пароль#1
        formulaWithResultUrl2AndToken: MerchantLogin:OutSum:InvId:Receipt:ResultUrl2:Token:Пароль#1
        documentation: https://docs.robokassa.ru/ru/saving#saving-signature
      x-robokassa-environment:
        testSupported: false
        productionSupported: true
        note: Тестовый режим не поддерживается. Метод работает только в основном режиме.
    post:
      tags:
        - Payments
      summary: Открыть платежную страницу для оплаты по сохраненной карте через HTML-форму
      description: |
        POST-вариант запуска CoF-платежа. Параметры передаются как
        `application/x-www-form-urlencoded`; `Token` обязателен.
      operationId: createCoFPaymentPost
      x-robokassa-authentication:
        type: request-signature
        required: true
      servers:
        - url: https://auth.robokassa.ru
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CoFPaymentRequest"
      responses:
        "200":
          description: |
            HTML-страница платежной формы или страница с сообщением об ошибке
            параметров. При неверной подписи код прикладной ошибки передается
            внутри контекста страницы, например `RoboxContext.error.code=29`.
          content:
            text/html:
              schema:
                type: string
        "302":
          description: |
            Запрос обработан. В заголовке `Location` возвращается относительный
            URL платежной страницы. Этот ответ не подтверждает создание или
            оплату операции.
          headers:
            Location:
              description: Относительный URL платежной страницы.
              required: true
              schema:
                type: string
                format: uri-reference
                example: /Merchant/Index/01234567-89ab-4cde-8f01-23456789abcd
        default:
          description: Транспортная ошибка запуска платежа.
      x-robokassa-custom-parameters:
        prefix: Shp_
        description: Пользовательские параметры возвращаются в уведомлениях без изменений.
      x-robokassa-signature:
        parameter: SignatureValue
        password: Пароль#1
        formulaWithOnlyToken: MerchantLogin:OutSum:InvId:Token:Пароль#1
        formulaWithReceiptAndToken: MerchantLogin:OutSum:InvId:Receipt:Token:Пароль#1
        formulaWithResultUrl2AndToken: MerchantLogin:OutSum:InvId:Receipt:ResultUrl2:Token:Пароль#1
        documentation: https://docs.robokassa.ru/ru/saving#saving-signature
      x-robokassa-environment:
        testSupported: false
        productionSupported: true
        note: Тестовый режим не поддерживается. Метод работает только в основном режиме.

  /Merchant/Payment/CreateV2:
    get:
      tags:
        - SplitPayments
      summary: Создать платеж со сплитованием
      description: |
        Инициализирует платежную форму с распределением суммы между
        мастер-магазином и магазинами-участниками. Параметр `invoice` передается
        как URL-кодированная JSON-строка.

        Метод проверяет структуру `invoice` и подпись, затем возвращает редирект
        на платежную страницу. Проведение оплаты и фактическое распределение
        средств этим ответом не подтверждаются.
      operationId: createSplitPayment
      x-robokassa-authentication:
        type: request-signature
        required: true
      servers:
        - url: https://auth.robokassa.ru
      parameters:
        - name: invoice
          in: query
          required: true
          description: URL-кодированное JSON-тело операции оплаты и распределения.
          schema:
            type: string
          x-robokassa-json-schema: "#/components/schemas/SplitPaymentInvoice"
          x-robokassa-json-schema-ref:
            $ref: "#/components/schemas/SplitPaymentInvoice"
        - name: signature
          in: query
          required: true
          description: |
            Подпись запроса. Рассчитывается по исходной JSON-строке `invoice`
            до URL-кодирования и Паролю#1 мастер-магазина.
          schema:
            type: string
            pattern: '^[0-9a-fA-F]+$'
      responses:
        "200":
          description: |
            HTML-страница платежной формы или страница с сообщением об ошибке
            параметров. При неверной подписи код прикладной ошибки передается
            внутри контекста страницы, например `RoboxContext.error.code=29`.
          content:
            text/html:
              schema:
                type: string
        "302":
          description: |
            Запрос обработан. В заголовке `Location` возвращается относительный
            URL платежной страницы. Этот ответ не подтверждает проведение оплаты
            или фактическое распределение средств.
          headers:
            Location:
              description: Относительный URL платежной страницы.
              required: true
              schema:
                type: string
                format: uri-reference
                example: /Merchant/Index/01234567-89ab-4cde-8f01-23456789abcd
        default:
          description: Транспортная ошибка запуска платежа.
      x-robokassa-signature:
        parameter: signature
        password: Пароль#1 мастер-магазина
        base: Исходная JSON-строка `invoice` без URL-кодирования + Пароль#1.
        documentation: https://docs.robokassa.ru/ru/split-payments#split-request-parameters
      x-robokassa-environment:
        testSupported: false
        productionSupported: true
        note: Тестовый режим не поддерживается. Метод работает только в основном режиме.
    post:
      tags:
        - SplitPayments
      summary: Создать платеж со сплитованием через HTML-форму
      description: |
        POST-вариант инициализации платежной формы со сплитованием. Тело запроса
        передается как `application/x-www-form-urlencoded`.

        Подпись рассчитывается по исходной JSON-строке `invoice` до URL-кодирования
        и Паролю#1 мастер-магазина.
      operationId: createSplitPaymentPost
      x-robokassa-authentication:
        type: request-signature
        required: true
      servers:
        - url: https://auth.robokassa.ru
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/SplitPaymentFormRequest"
      responses:
        "200":
          description: |
            HTML-страница платежной формы или страница с сообщением об ошибке
            параметров. При неверной подписи код прикладной ошибки передается
            внутри контекста страницы, например `RoboxContext.error.code=29`.
          content:
            text/html:
              schema:
                type: string
        default:
          description: Транспортная ошибка запуска платежа.
      x-robokassa-signature:
        parameter: signature
        password: Пароль#1 мастер-магазина
        base: Исходная JSON-строка `invoice` без URL-кодирования + Пароль#1.
        documentation: https://docs.robokassa.ru/ru/split-payments#split-request-parameters
      x-robokassa-environment:
        testSupported: false
        productionSupported: true
        note: Тестовый режим не поддерживается. Метод работает только в основном режиме.

  /SMS/:
    get:
      tags:
        - Messaging
      summary: Отправить SMS методом GET
      operationId: sendSmsGet
      x-robokassa-authentication:
        type: request-signature
        required: true
      servers:
        - url: https://services.robokassa.ru
      parameters:
        - $ref: "#/components/parameters/SmsLogin"
        - $ref: "#/components/parameters/SmsPhone"
        - $ref: "#/components/parameters/SmsMessage"
        - $ref: "#/components/parameters/SmsSignature"
      responses:
