webhooks:
  paymentResult:
    post:
      summary: Уведомление об успешной оплате на ResultURL
      description: |
        Robokassa отправляет данные на ResultURL магазина. Получатель обязан
        проверить `SignatureValue` по формуле
        `OutSum:InvId:Пароль#2:Shp_*` и только после этого изменить состояние заказа.
      operationId: paymentResultNotification
      x-robokassa-authentication:
        type: request-signature
        required: true
      x-robokassa-signature:
        parameter: SignatureValue
        password: Пароль#2
        formula: OutSum:InvId:Пароль#2:Shp_*
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/PaymentResult"
      responses:
        "200":
          $ref: "#/components/responses/ResultUrlAccepted"
      x-robokassa-custom-parameters:
        prefix: Shp_
        description: Все переданные при запуске платежа параметры Shp_*.
    get:
      summary: Уведомление об успешной оплате на ResultURL методом GET
      description: |
        GET используется, если этот метод выбран в технических настройках магазина.
        Проверка подписи и формат ответа совпадают с POST-уведомлением.
      operationId: paymentResultNotificationGet
      x-robokassa-authentication:
        type: request-signature
        required: true
      x-robokassa-signature:
        parameter: SignatureValue
        password: Пароль#2
        formula: OutSum:InvId:Пароль#2:Shp_*
      parameters:
        - $ref: "#/components/parameters/ResultOutSum"
        - $ref: "#/components/parameters/ResultInvId"
        - $ref: "#/components/parameters/ResultSignatureValue"
        - name: Fee
          in: query
          description: Комиссия Robokassa.
          schema:
            type: string
        - name: EMail
          in: query
          description: Email покупателя.
          schema:
            type: string
            format: email
        - name: PaymentMethod
          in: query
          description: Использованный способ оплаты.
          schema:
            type: string
        - name: IncCurrLabel
          in: query
          description: Валюта оплаты.
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ResultUrlAccepted"
      x-robokassa-custom-parameters:
        prefix: Shp_
        description: Все переданные при запуске платежа параметры Shp_*.

  paymentResult2:
    post:
      summary: Дополнительное уведомление на ResultUrl2
      description: |
        Серверное уведомление в формате JWS Compact Serialization. Для холдов это
        единственный способ получить состояние `HOLD`. Уведомление всегда
        отправляется методом POST.

        Получатель обязан проверить подпись JWS сертификатом Robokassa до
        обработки полей `data` и изменения состояния заказа.
      operationId: paymentResult2Notification
      x-robokassa-authentication:
        type: jws
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              contentMediaType: application/jose
              pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
              description: JWS в компактном представлении.
      responses:
        "200":
          description: Уведомление принято магазином.
        "400":
          description: Некорректный формат JWS или подпись не прошла проверку.
      x-jws-decoded-schema: "#/components/schemas/ResultUrl2Notification"
      x-jws-decoded-schema-ref:
        $ref: "#/components/schemas/ResultUrl2Notification"
      x-jws-certificate: https://docs.robokassa.ru/media/files/jwtsign.cer

  paymentSuccessRedirect:
    get:
      summary: Возврат покупателя на SuccessURL методом GET
      description: |
        Браузерный редирект после успешной оплаты. Не используйте его как
        единственное подтверждение платежа — состояние заказа меняйте по ResultURL.
      operationId: paymentSuccessRedirectGet
      x-robokassa-authentication:
        type: request-signature
        required: true
      x-robokassa-signature:
        parameter: SignatureValue
        password: Пароль#1
        formula: OutSum:InvId:Пароль#1:Shp_*
      parameters:
        - $ref: "#/components/parameters/ResultOutSum"
        - $ref: "#/components/parameters/ResultInvId"
        - $ref: "#/components/parameters/SuccessSignatureValue"
        - $ref: "#/components/parameters/RedirectCulture"
      responses:
        "200":
          description: Страница магазина, отображаемая покупателю.
      x-robokassa-custom-parameters:
        prefix: Shp_
        description: Пользовательские параметры, переданные при запуске платежа.
    post:
      summary: Возврат покупателя на SuccessURL методом POST
      description: |
        Браузерный редирект после успешной оплаты. Параметры передаются как
        `application/x-www-form-urlencoded`. Основное подтверждение приходит на ResultURL.
      operationId: paymentSuccessRedirectPost
      x-robokassa-authentication:
        type: request-signature
        required: true
      x-robokassa-signature:
        parameter: SignatureValue
        password: Пароль#1
        formula: OutSum:InvId:Пароль#1:Shp_*
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/PaymentSuccessRedirect"
      responses:
        "200":
          description: Страница магазина, отображаемая покупателю.
      x-robokassa-custom-parameters:
        prefix: Shp_
        description: Пользовательские параметры, переданные при запуске платежа.

  paymentFailRedirect:
    get:
      summary: Возврат покупателя на FailURL методом GET
      description: |
        Браузерный редирект после отказа или прерывания оплаты. Он не означает
        окончательную отмену операции; актуальное состояние проверяйте отдельно.
      operationId: paymentFailRedirectGet
      x-robokassa-authentication:
        type: none
        required: false
        reason: FailURL не содержит контрольной суммы и не подтверждает состояние платежа.
      parameters:
        - $ref: "#/components/parameters/ResultOutSum"
        - $ref: "#/components/parameters/ResultInvId"
        - $ref: "#/components/parameters/RedirectCulture"
      responses:
        "200":
          description: Страница магазина, отображаемая покупателю.
      x-robokassa-custom-parameters:
        prefix: Shp_
        description: Пользовательские параметры, переданные при запуске платежа.
    post:
      summary: Возврат покупателя на FailURL методом POST
      description: |
        Браузерный редирект после отказа или прерывания оплаты. Параметры
        передаются как `application/x-www-form-urlencoded`.
      operationId: paymentFailRedirectPost
      x-robokassa-authentication:
        type: none
        required: false
        reason: FailURL не содержит контрольной суммы и не подтверждает состояние платежа.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/PaymentFailRedirect"
      responses:
        "200":
          description: Страница магазина, отображаемая покупателю.
      x-robokassa-custom-parameters:
        prefix: Shp_
        description: Пользовательские параметры, переданные при запуске платежа.

components:
  requestBodies:
    InvoiceJwt:
      required: true
      description: |
        Подписанный JWT передается в теле запроса как одна JSON-строка:
        `"BASE64URL_HEADER.BASE64URL_PAYLOAD.SIGNATURE"`.

        Состав JWT:
        - Header: JSON с типом токена и алгоритмом подписи, например `{"typ":"JWT","alg":"MD5"}`.
        - Payload: JSON с параметрами конкретного метода.
        - BASE64URL_HEADER: Header после Base64Url-кодирования без padding.
        - BASE64URL_PAYLOAD: Payload после Base64Url-кодирования без padding.
        - Signature: подпись, рассчитанная магазином. Секретный ключ составляется
          как `MerchantLogin:Пароль#1`.
      content:
        application/json:
          schema:
            type: string
            contentMediaType: application/jwt
            description: Подписанный JWT, переданный как JSON-строка, а не как JSON-объект.
            pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'

  parameters:
    MerchantLogin:
      name: MerchantLogin
      in: query
      required: true
      description: Идентификатор магазина.
      schema:
        type: string
    OutSum:
      name: OutSum
      in: query
      required: true
      description: Сумма к оплате с точкой в качестве десятичного разделителя.
      schema:
        type: string
        pattern: '^\d+(\.\d+)?$'
        example: "100.00"
    InvId:
      name: InvId
      in: query
      required: false
      description: Уникальный номер счета магазина. Если значение равно `0` или параметр отсутствует, номер назначается автоматически.
      schema:
        type: integer
        format: int64
        minimum: 0
        maximum: 9223372036854775807
    SignatureValue:
      name: SignatureValue
      in: query
      required: true
      description: Подпись запроса, рассчитанная с использованием Пароля#1.
      schema:
        type: string
    ResultOutSum:
      name: OutSum
      in: query
      required: true
      description: Сумма платежа в точном формате из уведомления.
      schema:
        type: string
        example: "100.000000"
    ResultInvId:
      name: InvId
      in: query
      required: true
      description: Номер счета магазина.
      schema:
        type: string
        example: "450009"
    ResultSignatureValue:
      name: SignatureValue
      in: query
      required: true
      description: Подпись уведомления, рассчитанная с использованием Пароля#2.
      schema:
        type: string
    SuccessSignatureValue:
      name: SignatureValue
      in: query
      required: true
      description: Подпись SuccessURL, рассчитанная с использованием Пароля#1.
      schema:
        type: string
    RedirectCulture:
      name: Culture
      in: query
      required: false
      description: Язык платежной страницы.
      schema:
        type: string
        enum:
          - ru
          - en
    SmsLogin:
      name: login
      in: query
      required: true
      description: Идентификатор магазина.
      schema:
        type: string
    SmsPhone:
      name: phone
      in: query
      required: true
      description: Номер телефона в международном формате без символа `+`.
      schema:
        type: string
        pattern: '^\d+$'
        example: "79999999999"
    SmsMessage:
      name: message
      in: query
      required: true
      description: Текст сообщения в UTF-8, не более 128 символов.
      schema:
        type: string
        maxLength: 128
    SmsSignature:
      name: signature
      in: query
      required: true
      description: Подпись `login:phone:message:Пароль#1`.
      schema:
        type: string

  responses:
    ResultUrlAccepted:
      description: Уведомление принято.
      content:
        text/plain:
          schema:
            type: string
            pattern: '^OK\d+$'
            example: OK450009

  schemas:
    PaymentStartRequest:
      type: object
      required:
        - MerchantLogin
        - OutSum
        - SignatureValue
      properties:
        MerchantLogin:
          type: string
        OutSum:
          type: string
          pattern: '^\d+(\.\d+)?$'
          example: "100.00"
        SignatureValue:
          type: string
        InvId:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: Если значение равно `0` или поле отсутствует, номер назначается автоматически.
        Description:
          type: string
          maxLength: 100
        Email:
          type: string
          format: email
        IncCurrLabel:
          type: string
        Culture:
          type: string
          enum:
            - ru
            - en
        Encoding:
          type: string
          default: UTF-8
        IsTest:
          type: integer
          enum:
            - 0
            - 1
        ExpirationDate:
          type: string
        Receipt:
          type: string
        IsWithoutFreeSale:
          type: boolean
          description: |
            Запрещает автоматически формировать чек с позицией «Свободная
            продажа», если `Receipt` не передан. Не участвует в расчете
            `SignatureValue`.
        FiscalParentOpId:
          type: integer
          format: int64
          description: |
            OpId родительской операции для связанной фискализации. Не участвует
            в расчете `SignatureValue`.
        StepByStep:
          type: boolean
        PaymentMethods:
          type: array
          items:
            type: string
        ResultUrl2:
          type: string
          format: uri
        SuccessUrl2:
          type: string
          format: uri
        SuccessUrl2Method:
          $ref: "#/components/schemas/RedirectMethod"
        FailUrl2:
          type: string
          format: uri
        FailUrl2Method:
          $ref: "#/components/schemas/RedirectMethod"
        Token:
          type: string
        Recurring:
          type: boolean
      patternProperties:
        "^Shp_":
          type: string
      additionalProperties: false
      description: Дополнительные поля допускаются только для параметров с префиксом `Shp_`.

    CoFPaymentRequest:
      type: object
      required:
        - MerchantLogin
        - OutSum
        - SignatureValue
        - Token
      properties:
        MerchantLogin:
          type: string
        OutSum:
          type: string
          pattern: '^\d+(\.\d+)?$'
          example: "100.00"
        SignatureValue:
          type: string
        Token:
          type: string
          description: OpKey операции, карту которой нужно использовать для новой оплаты.
        InvId:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: Если значение равно `0` или поле отсутствует, номер назначается автоматически.
        Description:
          type: string
          maxLength: 100
        Email:
          type: string
          format: email
        Culture:
          type: string
          enum:
            - ru
            - en
        Receipt:
          type: string
        ResultUrl2:
          type: string
          format: uri
      additionalProperties:
        type: string
      description: Дополнительные поля допускаются только для параметров с префиксом `Shp_`.

    PaymentSuccessRedirect:
      type: object
      required:
        - OutSum
        - InvId
        - SignatureValue
      properties:
        OutSum:
          type: string
        InvId:
          type: string
        SignatureValue:
          type: string
          description: Подпись с использованием Пароля#1.
        Culture:
          type: string
          enum:
            - ru
            - en
      patternProperties:
        "^Shp_":
          type: string
      additionalProperties: false

    PaymentFailRedirect:
      type: object
      required:
        - OutSum
        - InvId
      properties:
        OutSum:
          type: string
        InvId:
          type: string
        Culture:
          type: string
          enum:
            - ru
            - en
      patternProperties:
        "^Shp_":
          type: string
      additionalProperties: false

    HoldConfirmRequest:
      type: object
      required:
        - MerchantLogin
        - InvoiceID
        - OutSum
        - SignatureValue
      properties:
        MerchantLogin:
          type: string
        InvoiceID:
          type: integer
          format: int64
        OutSum:
          type: string
          pattern: '^\d+(\.\d+)?$'
        Receipt:
          type: string
          description: Обновленный JSON чека в URL-кодировке.
        SignatureValue:
          type: string

    HoldCancelRequest:
      type: object
      required:
        - MerchantLogin
        - InvoiceID
        - OutSum
        - SignatureValue
      properties:
        MerchantLogin:
          type: string
        InvoiceID:
          type: integer
          format: int64
        OutSum:
          type: string
          description: Передается в запросе, но не включается в подпись.
        SignatureValue:
          type: string

    HoldActionResponse:
      type: string
      enum:
        - "success: true"
        - "success: false"
      description: |
        Ответ возвращается как JSON-строка, а не JSON-объект.
        HTTP 200 означает только успешную обработку HTTP-запроса.
        Значение `"success: true"` означает, что запрос принят; итоговое состояние
        необходимо проверить через OpStateExt, ResultURL или ResultUrl2.

        Значение `"success: false"` запрещает автоматический повтор запроса.
        Сначала необходимо проверить состояние операции. Повторный Confirm по уже
        подтвержденному `InvoiceID` возвращает `"success: false"`; повторного
        списания не происходит.

    RecurringPaymentRequest:
      type: object
      required:
        - MerchantLogin
        - InvoiceID
        - PreviousInvoiceID
        - OutSum
        - SignatureValue
      properties:
        MerchantLogin:
          type: string
        InvoiceID:
          type: integer
          format: int64
          minimum: 1
        PreviousInvoiceID:
          type: integer
          format: int64
          minimum: 1
          description: Номер успешно оплаченной материнской операции.
        OutSum:
          type: string
          pattern: '^\d+(\.\d+)?$'
        Description:
          type: string
        Receipt:
          type: string
          description: JSON чека в URL-кодировке.
        SignatureValue:
          type: string
      additionalProperties:
        type: string
      description: Дополнительные поля допускаются только для параметров с префиксом `Shp_`.

    RecurringProblem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string

    SplitPaymentInvoice:
      type: object
      required:
        - outAmount
        - merchant
        - splitMerchants
      properties:
        outAmount:
          type: number
          exclusiveMinimum: 0
          description: Требуемая к получению сумма заказа.
        shop_params:
          type: array
          items:
            $ref: "#/components/schemas/SplitPaymentShopParam"
        email:
          type: string
          format: email
        incCurr:
          type: string
          description: Предпочтительный способ оплаты.
        language:
          type: string
          enum:
            - ru
            - en
        expirationDate:
          type: string
          format: date-time
        merchant:
          $ref: "#/components/schemas/SplitPaymentMerchant"
        splitMerchants:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SplitPaymentParticipant"

    SplitPaymentFormRequest:
      type: object
      required:
        - invoice
        - signature
      properties:
        invoice:
          type: string
          description: URL-кодированная JSON-строка платежа со сплитованием.
          x-robokassa-json-schema: "#/components/schemas/SplitPaymentInvoice"
          x-robokassa-json-schema-ref:
            $ref: "#/components/schemas/SplitPaymentInvoice"
        signature:
          type: string
          description: Подпись по исходной JSON-строке `invoice` до URL-кодирования и Паролю#1 мастер-магазина.
          pattern: '^[0-9a-fA-F]+$'

    SplitPaymentShopParam:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
        value:
          type: string

    SplitPaymentMerchant:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: Идентификатор мастер-магазина.
        comment:
          type: string
          maxLength: 100

    SplitPaymentParticipant:
      type: object
      required:
        - id
        - amount
      properties:
        id:
          type: string
          description: Идентификатор магазина-участника.
        InvoiceId:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: Номер счета магазина-участника. Если значение равно `0` или поле отсутствует, номер назначается автоматически.
        amount:
          type: number
          minimum: 0
        receipt:
          $ref: "#/components/schemas/SplitPaymentReceipt"

    SplitPaymentReceipt:
      type: object
      required:
        - items
      properties:
        sno:
          type: string
          enum:
            - osn
            - usn_income
            - usn_income_outcome
            - envd
            - esn
            - patent
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SplitPaymentReceiptItem"

    SplitPaymentReceiptItem:
      type: object
      required:
        - name
        - quantity
        - sum
        - tax
      properties:
        name:
          type: string
          maxLength: 128
        quantity:
          type: number
          exclusiveMinimum: 0
        sum:
          type: number
          minimum: 0
        tax:
          type: string
          enum:
            - none
            - vat0
            - vat10
            - vat110
            - vat20
            - vat120
        payment_method:
          type: string
          enum:
            - full_prepayment
            - prepayment
            - advance
            - full_payment
            - partial_payment
            - credit
            - credit_payment
        payment_object:
          type: string
          enum:
            - commodity
            - excise
            - job
            - service
            - gambling_bet
            - gambling_prize
            - lottery
            - lottery_prize
            - intellectual_activity
            - payment
            - agent_commission
            - composite
            - another
            - property_right
            - non-operating_gain
            - insurance_premium
            - sales_tax
            - resort_fee
        nomenclature_code:
          type: string

    SmsRequest:
      type: object
      required:
        - login
        - phone
        - message
        - signature
      properties:
        login:
          type: string
        phone:
          type: string
          pattern: '^\d+$'
        message:
          type: string
          maxLength: 128
        signature:
          type: string

    SmsResponse:
      type: object
      required:
        - result
      properties:
        result:
          oneOf:
            - type: boolean
            - type: integer
              enum:
                - 0
                - 1
        count:
          type: integer
          description: Количество доступных SMS после запроса. Поле заполняется только при успешном исполнении.
        errorCode:
          type: integer
          enum:
            - 0
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
            - 1000
            - 9999
        errorMessage:
          type:
            - string
            - "null"

    ResultUrl2Notification:
      type: object
      required:
        - header
        - data
      properties:
        header:
          type: object
          required:
            - type
            - version
            - timestamp
          properties:
            type:
              type: string
              example: PaymentStateNotification
            version:
              type: string
              example: 1.0.0
            timestamp:
              type: string
              description: Unix timestamp в виде строки.
        data:
          type: object
          required:
            - shop
            - opKey
            - invId
            - paymentMethod
            - incSum
            - state
          properties:
            shop:
              type: string
            opKey:
              type: string
            invId:
              type: string
            paymentMethod:
              type: string
            incSum:
              type: string
            state:
              type: string
              examples:
                - HOLD
                - OK

    RedirectMethod:
      type: string
      enum:
        - GET
        - POST

    FiscalReceiptRegisterPayload:
      type: object
      description: Payload до Base64Url-кодирования и подписания JWT.
      required:
        - ShopLocator
        - Receipts
      properties:
        ShopLocator:
          $ref: "#/components/schemas/FiscalShopLocator"
        Receipts:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/DeferredFiscalReceipt"

    FiscalShopLocator:
      type: object
      description: Передайте один из идентификаторов магазина.
      properties:
        MrhId:
          type: integer
          format: int64
          description: Внутренний номер магазина в Robokassa.
        Id:
          type: string
          format: uuid
          description: Внутренний GUID магазина.
        Identifier:
          type: string
          description: MerchantLogin магазина. Рекомендуется для интеграции мерчанта.
      oneOf:
        - required:
            - MrhId
        - required:
            - Id
        - required:
            - Identifier

    DeferredFiscalReceipt:
      type: object
      required:
        - OpId
        - Type
        - Items
        - Payments
      properties:
        OpId:
          type: integer
          format: int64
          description: Robox ID успешно оплаченной операции.
        Url:
          type: string
          format: uri
          description: URL главной страницы магазина без URL-кодирования.
        TaxScheme:
          $ref: "#/components/schemas/DeferredTaxScheme"
        Type:
          type: string
          enum:
            - Sell
          description: Тип чека. Для продажи используется Sell.
        VatType:
          $ref: "#/components/schemas/DeferredVatType"
        Items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/DeferredFiscalItem"
        CorrectionInfo:
          $ref: "#/components/schemas/DeferredCorrectionInfo"
        Payments:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/DeferredFiscalPayment"
        Client:
          $ref: "#/components/schemas/DeferredFiscalClient"

    DeferredTaxScheme:
      type: string
      enum:
        - Osn
        - UsnIncome
        - UsnIncomeOutcome
        - Envd
        - Esn
        - Patent
        - AusnIncome
        - AusnIncomeOutcome

    DeferredVatType:
      type: string
      enum:
        - None
        - Vat0
        - Vat10
        - Vat18
        - Vat110
        - Vat118
        - Vat20
        - Vat120
        - Vat12
        - Vat8
        - Vat5
        - Vat105
        - Vat7
        - Vat107
        - Vat22
        - Vat122

    DeferredFiscalItem:
      type: object
      required:
        - Name
        - Quantity
        - VatType
        - PaymentMethod
        - PaymentObject
      properties:
        Name:
          type: string
          maxLength: 128
        Quantity:
          type: number
          exclusiveMinimum: 0
        Sum:
          type: number
          minimum: 0
          description: Полная сумма позиции.
        Cost:
          type: number
          minimum: 0
          description: Цена единицы товара или услуги.
        BonusSum:
          type: number
          minimum: 0
          description: Часть стоимости позиции, оплаченная бонусами.
        VatType:
          $ref: "#/components/schemas/DeferredVatType"
        PaymentMethod:
          type: string
          enum:
            - FullPrepayment
            - Prepayment
            - Advance
            - FullPayment
            - PartialPayment
            - Credit
            - CreditPayment
        PaymentObject:
          type: string
          description: Признак предмета расчета.
          example: Commodity
        NomenclatureCode:
          type: string
          description: Код маркировки без дополнительного кодирования.
        AgentInfo:
          $ref: "#/components/schemas/DeferredAgentInfo"
        SupplierInfo:
          $ref: "#/components/schemas/DeferredSupplierInfo"
        IsNonAgentItem:
          type: boolean
          description: Отключает агентскую схему для отдельной позиции.
      anyOf:
        - required:
            - Sum
        - required:
            - Cost

    DeferredAgentInfo:
      type: object
      properties:
        Type:
          type: string
          example: BankPayingAgent

    DeferredSupplierInfo:
      type: object
      properties:
        Name:
          type: string
        Inn:
          type: string
        Phones:
          type: array
          items:
            type: string

    DeferredCorrectionInfo:
      type: object
      properties:
        Type:
          type: string
          example: Self
        Description:
          type: string
        CorrectedReceiptId:
          type: integer
          format: int32
          minimum: 0
          description: Номер корректируемого чека в Robokassa.
        Prescription:
          type: string
          description: Номер предписания налогового органа.
        BaseDate:
          type: string
          pattern: '^\d{4}\.\d{2}\.\d{2}$'
          example: "2026.08.20"

    DeferredFiscalPayment:
      type: object
      required:
        - Type
        - Sum
      properties:
        Type:
          type: string
          enum:
            - Cash
            - Cashless
            - Advance
            - Credit
            - Another
        Sum:
          type: number
          minimum: 0

    DeferredFiscalClient:
      type: object
      properties:
        Email:
          type: string
          format: email
        Phone:
          type: string
      anyOf:
        - required:
            - Email
        - required:
            - Phone

    FiscalReceiptError:
      type: object
      required:
        - Text
        - Type
      properties:
        Text:
          type: string
        Type:
          type: string
          enum:
            - InternalError
            - ValidationError
            - ProcessingError

    FiscalReceiptRegistrationResult:
      type: object
      required:
        - IsSuccess
        - OpId
      properties:
        IsSuccess:
          type: boolean
        OpId:
          type: integer
          format: int64
        ReceiptId:
          type: integer
          format: int64
        ReceiptType:
          type: string
          example: Sell
        Errors:
          type: array
          items:
            $ref: "#/components/schemas/FiscalReceiptError"

    FiscalReceiptRegisterResponse:
      type: object
      required:
        - IsSuccess
      properties:
        IsSuccess:
          type: boolean
        Data:
          type: object
          properties:
            ReceiptRegistrationResults:
              type: array
              items:
                $ref: "#/components/schemas/FiscalReceiptRegistrationResult"
        Errors:
          type: array
          items:
            $ref: "#/components/schemas/FiscalReceiptError"

    InvoiceCreatePayload:
      type: object
      description: Payload до Base64Url-кодирования и подписания JWT.
      required:
        - MerchantLogin
        - InvoiceType
      properties:
        MerchantLogin:
          type: string
          description: Логин магазина.
        InvoiceType:
          type: string
          enum:
            - OneTime
            - Reusable
        Culture:
          type: string
          enum:
            - ru
            - en
        InvId:
          type:
            - integer
            - "null"
          format: int64
        OutSum:
          type: number
          exclusiveMinimum: 0
        ExpirationDate:
          type: string
          format: date-time
          description: Дата и время окончания действия счета.
        Description:
          type: string
        FiscalParentOpId:
          type: integer
          format: int64
          description: OpId родительской операции для связной фискализации.
        MerchantComments:
          type: string
        UserFields:
          type: object
          additionalProperties:
            type: string
        InvoiceItems:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceItem"
        SuccessUrl2Data:
          $ref: "#/components/schemas/RedirectData"
        FailUrl2Data:
          $ref: "#/components/schemas/RedirectData"
        Aliases:
          type: array
          description: Способы оплаты, доступные для счета.
          items:
            type: string
        Payments:
          type: array
          description: Распределение суммы по типам платежа для фискализации.
          items:
            $ref: "#/components/schemas/InvoicePayment"
        CustomUserProperty:
          $ref: "#/components/schemas/InvoiceCustomUserProperty"
        IsWithoutFreeSale:
          type: boolean
          description: Запрещает кассе создавать позицию «Свободная продажа».
        Sno:
          type: string
          description: Система налогообложения.
        AdditionalParameters:
          type: object
          description: |
            Дополнительные строковые параметры платежной формы. Разрешенные
            ключи: IsTest, IncCurrLabel, PaymentMethods, Email, ResultURL2,
            StepByStep, Recurring, Token, Split, Culture, SuccessUrl2,
            SuccessUrl2Method, FailUrl2, FailUrl2Method, IsWithoutFreeSale и
            FiscalParentOpId. Неизвестные ключи игнорируются.
            При IsTest=1 JWT подписывается тестовым Паролем#1.
          additionalProperties:
            type: string
          example:
            IsTest: "1"
            IncCurrLabel: BankCard
            PaymentMethods: '["BankCard","SBP"]'
            Email: buyer@example.com
      anyOf:
        - required:
            - OutSum
        - required:
            - InvoiceItems

    InvoiceDeactivatePayload:
      type: object
      required:
        - MerchantLogin
      properties:
        MerchantLogin:
          type: string
          description: Логин магазина.
        EncodedId:
          type: string
          description: Последний сегмент ссылки на оплату счета.
        Id:
          type: string
          format: uuid
          description: Внутренний идентификатор счета Invoice API.
        InvId:
          type: integer
          format: int64
          description: Номер счета магазина.
      oneOf:
        - required:
            - EncodedId
        - required:
            - Id
        - required:
            - InvId

    InvoiceInformationFilter:
      type: object
      required:
        - MerchantLogin
        - CurrentPage
        - PageSize
        - InvoiceStatuses
        - DateFrom
        - DateTo
        - InvoiceTypes
      properties:
        MerchantLogin:
          type: string
          description: Логин магазина.
        CurrentPage:
          type: integer
          minimum: 1
        PageSize:
          type: integer
          minimum: 1
        InvoiceStatuses:
          type: array
          items:
            type: string
            enum:
              - Paid
              - Expired
              - NotPaid
        Keywords:
          type: string
          description: Поиск по сумме, идентификатору, описанию или email.
        DateFrom:
          type: string
          format: date-time
        DateTo:
          type: string
          format: date-time
        IsAscending:
          type: boolean
        InvoiceTypes:
          type: array
          items:
            type: string
            enum:
