      x-robokassa-signature:
        password: Пароль#1
        formula: login:phone:message:Пароль#1
        documentation: https://docs.robokassa.ru/ru/sms-notifications#request-parameters
        clientExample: https://github.com/robokassa/cms-wordpress/blob/92c8c6aceffe283f89319ac41ead78bc573bb361/classes/Robokassa/Payment/RobokassaPayAPI.php#L690
      x-robokassa-environment:
        testSupported: false
        productionSupported: true
        note: Метод не имеет отдельного тестового режима.
    post:
      tags:
        - Messaging
      summary: Отправить SMS методом POST
      operationId: sendSmsPost
      x-robokassa-authentication:
        type: request-signature
        required: true
      servers:
        - url: https://services.robokassa.ru
      requestBody:
        required: true
        content:
