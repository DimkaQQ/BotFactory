openapi: 3.1.0
info:
  title: Robokassa API
  version: 1.3.0
  description: |
    OpenAPI-спецификация платежных интерфейсов Robokassa. Она описывает запуск
    платежей, выставление счетов, проверку состояния операций, возвраты,
    холдирование, рекуррентные платежи, SMS-уведомления и обработку callback-запросов.

    Правила формирования подписи, фискализации, настройки уведомлений и подключения
    отдельных возможностей приведены в документации Robokassa.
  contact:
    name: Robokassa
    url: https://docs.robokassa.ru/
x-robokassa-authentication:
  description: |
    Robokassa использует зависящие от запроса подписи в query-параметрах,
    form-телах, JWT или JWS. Эти механизмы нельзя точно описать стандартным
    OpenAPI Security Scheme, поэтому способ проверки явно указан у каждой
    операции в расширении `x-robokassa-authentication`.
  standardSecuritySchemeSupported: false
  operationExtension: x-robokassa-authentication
  types:
    request-signature: Контрольная сумма запроса, рассчитанная с паролем магазина.
    jwt: JWT, подписанный паролем магазина.
    jws: JWS, подпись которого проверяется сертификатом Robokassa.
    none: Метод не требует криптографической аутентификации запроса.
x-robokassa-contract-verification:
  date: 2026-08-10
  environment: production
  verifiedOperations:
    - createPayment
    - createPaymentPost
    - createInvoice
    - deactivateInvoice
    - getInvoiceInformation
    - listInvoices
    - notifyInvoiceCustomer
    - getCurrencies
    - getOperationState
    - confirmHold
    - cancelHold
    - createCoFPayment
    - createCoFPaymentPost
    - createSplitPayment
    - createSplitPaymentPost
  partiallyVerifiedOperations:
    - operation: createRefund
      result: Получен HTTP 401 — API возвратов не подключен магазину или Password3 не активирован.
    - operation: getRefundState
      result: Подтвержден HTTP 400 для несуществующего requestId; успешная заявка не создавалась.
    - operation: paymentSuccessRedirectGet
      result: Контракт описан по документации; завершенный платеж для проверки редиректа не выполнялся.
    - operation: paymentSuccessRedirectPost
      result: Контракт описан по документации; завершенный платеж для проверки редиректа не выполнялся.
    - operation: paymentFailRedirectGet
      result: Контракт описан по документации; прерванный платеж для проверки редиректа не выполнялся.
    - operation: paymentFailRedirectPost
      result: Контракт описан по документации; прерванный платеж для проверки редиректа не выполнялся.
    - operation: createRecurringPayment
      result: Запрос подтвержден официальным WordPress-плагином; повторное списание не выполнялось.
    - operation: sendSmsGet
      result: Запрос подтвержден официальным WordPress-плагином; SMS не отправлялось.
    - operation: sendSmsPost
      result: POST описан документацией; плагин использует GET-вариант.
    - operation: paymentResult2Notification
      result: Контракт описан по документации; уведомление не получалось в ходе проверки.
    - operation: registerFiscalReceipt
      result: Контракт описан по документации сервиса; реальный чек не регистрировался.
  notes:
    - >-
      CreateInvoice без IsTest проверен с основным Паролем#1; созданный счет
      после проверки деактивирован.
    - >-
      CreateInvoice с IsTest=1 и основным Паролем#1 отклоняется; успешный запрос
      с тестовым Паролем#1 не выполнялся.
    - Запуск оплаты проверен до отображения платежной страницы, без проведения платежа.
    - Успешный OpStateExt проверен на существующей завершенной операции; чувствительные значения не сохранялись.
    - Confirm проверен первым и повторным вызовом; повторного списания не произошло.
    - После Cancel проверен переход состояния операции из 50 в 60.
    - Реальный возврат средств не выполнялся.
x-robokassa-retry-policy:
  confirmHold:
    automaticRetry: false
    onFalse:
      action: checkOperationState
    states:
      "20": Операция всё ещё в HOLD. Не повторять без явного решения пользователя.
      "50": Операция обрабатывается. Проверить статус позже.
      "60": Confirm не требуется, деньги возвращены покупателю.
      "100": Confirm уже выполнен. Повторять нельзя.
  cancelHold:
    automaticRetry: false
    onFalse:
      action: checkOperationState
    states:
      "20": Операция всё ещё в HOLD. Не повторять без явного решения пользователя.
      "50": Операция обрабатывается. Проверить статус позже.
      "60": Cancel успешно выполнен, деньги возвращены покупателю.
      "100": Операция уже подтверждена, выполнить Cancel нельзя.
externalDocs:
  description: Документация Robokassa
  url: https://docs.robokassa.ru/ru/
tags:
  - name: Payments
    description: Запуск оплаты через платежную страницу.
  - name: Invoices
    description: Выставление счетов через Invoice API.
  - name: Operations
    description: Получение состояния операций.
  - name: Reference
    description: Справочные методы Robokassa.
  - name: Refunds
    description: Создание возвратов и получение их состояния.
  - name: Holding
    description: Подтверждение и отмена двухстадийных платежей.
  - name: Recurring
    description: Повторные списания по рекуррентным платежам.
  - name: SplitPayments
    description: Создание платежей с распределением суммы между магазинами.
  - name: Messaging
    description: Отправка SMS через дополнительный сервис Robokassa.
  - name: Fiscalization
    description: Отдельная регистрация фискальных чеков после оплаты.
paths:
  /Merchant/Index.aspx:
    get:
      tags:
        - Payments
      summary: Открыть платежную страницу
      description: |
        Создает операцию оплаты и открывает платежную страницу Robokassa.
        Для тестового платежа передайте `IsTest=1`.

        Значение `SignatureValue` рассчитывается на стороне магазина. Базовая
        строка имеет вид
        `MerchantLogin:OutSum:InvId:модификаторы:Пароль#1:Shp_*`.

        Дополнительные параметры с префиксом `Shp_` разрешены. Их необходимо
        включать в подпись в алфавитном порядке.
      operationId: createPayment
      x-robokassa-authentication:
        type: request-signature
        required: true
      servers:
        - url: https://auth.robokassa.ru
      parameters:
        - $ref: "#/components/parameters/MerchantLogin"
        - $ref: "#/components/parameters/OutSum"
        - $ref: "#/components/parameters/SignatureValue"
        - $ref: "#/components/parameters/InvId"
        - name: Description
          in: query
          description: Название товара или услуги, без специальных символов.
          schema:
            type: string
            maxLength: 100
        - name: Email
          in: query
          description: Email покупателя для чеков и уведомлений.
          schema:
            type: string
            format: email
        - name: IncCurrLabel
          in: query
          description: Предлагаемый способ оплаты из интерфейса GetCurrencies.
          schema:
            type: string
        - name: Culture
          in: query
          description: Язык платежной страницы.
          schema:
            type: string
            enum:
              - ru
              - en
        - name: Encoding
          in: query
          description: Кодировка передаваемых данных.
          schema:
            type: string
            default: UTF-8
        - name: IsTest
          in: query
          description: Признак тестового режима.
          schema:
            type: integer
            enum:
              - 0
              - 1
        - name: ExpirationDate
          in: query
          description: Крайний срок оплаты в формате `YYYY-MM-DDThh:mm`.
          schema:
            type: string
            example: 2026-07-22T18:30
        - name: Receipt
          in: query
          description: Фискальные данные — минимизированный JSON в URL-кодировке.
          schema:
            type: string
        - name: IsWithoutFreeSale
          in: query
          description: |
            Если `true` и параметр `Receipt` отсутствует, автоматический чек с
            позицией «Свободная продажа» не формируется. Параметр не участвует
            в расчете `SignatureValue`.
          schema:
            type: boolean
        - name: FiscalParentOpId
          in: query
          description: |
            `OpId` родительской операции для связанной фискализации. Используется,
            например, чтобы связать аванс с последующей доплатой. Параметр не
            участвует в расчете `SignatureValue`.
          schema:
            type: integer
            format: int64
        - name: StepByStep
          in: query
          description: Признак двухстадийной оплаты.
          schema:
            type: boolean
        - name: PaymentMethods
          in: query
          description: Разрешенные способы оплаты. Параметр можно повторять.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: ResultUrl2
          in: query
          description: Дополнительный адрес серверного уведомления.
          schema:
            type: string
            format: uri
        - name: SuccessUrl2
          in: query
          description: Дополнительный адрес возврата после успешной оплаты.
          schema:
            type: string
            format: uri
        - name: SuccessUrl2Method
          in: query
          description: Метод запроса к SuccessUrl2.
          schema:
            $ref: "#/components/schemas/RedirectMethod"
        - name: FailUrl2
          in: query
          description: Дополнительный адрес возврата после ошибки оплаты.
          schema:
            type: string
            format: uri
        - name: FailUrl2Method
          in: query
          description: Метод запроса к FailUrl2.
          schema:
            $ref: "#/components/schemas/RedirectMethod"
        - name: Token
          in: query
          description: Токен сохраненной карты.
          schema:
            type: string
        - name: Recurring
          in: query
          description: Признак периодического платежа.
          schema:
            type: boolean
      responses:
        "200":
          description: |
            HTML-страница платежной формы или страница с сообщением об ошибке
            параметров. При неверной подписи код прикладной ошибки передается
            внутри контекста страницы, например `RoboxContext.error.code=29`.
          content:
            text/html:
              schema:
                type: string
        "302":
          description: |
            Запрос обработан. В заголовке `Location` возвращается относительный
            URL платежной страницы. Этот ответ не подтверждает создание или
            оплату операции.
          headers:
            Location:
              description: Относительный URL платежной страницы.
              required: true
              schema:
                type: string
                format: uri-reference
                example: /Merchant/Index/01234567-89ab-4cde-8f01-23456789abcd
        default:
          description: Транспортная ошибка запуска платежа.
      x-robokassa-custom-parameters:
        prefix: Shp_
        description: Пользовательские параметры возвращаются в уведомлениях без изменений.
      x-robokassa-signature:
        parameter: SignatureValue
        password: Пароль#1
        holdingFormulaWithoutReceipt: MerchantLogin:OutSum:InvId:true:Пароль#1
        holdingFormulaWithReceipt: MerchantLogin:OutSum:InvId:Receipt:true:Пароль#1
        holdingModifierCondition: Значение true добавляется в строку подписи только при StepByStep=true.
        documentation: https://docs.robokassa.ru/ru/pay-interface#signature
      x-robokassa-environment:
        testSupported: true
        productionSupported: true
        note: Метод работает в тестовом и основном режиме. Тестовый режим включается параметром IsTest=1.
    post:
      tags:
        - Payments
      summary: Открыть платежную страницу через HTML-форму
      description: |
        POST-вариант запуска обычного платежа. Параметры передаются как
        `application/x-www-form-urlencoded`. Формирование `SignatureValue` и
        обработка ответа совпадают с GET-вариантом.
      operationId: createPaymentPost
      x-robokassa-authentication:
        type: request-signature
        required: true
      servers:
        - url: https://auth.robokassa.ru
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/PaymentStartRequest"
      responses:
        "200":
          description: |
            HTML-страница платежной формы или страница с сообщением об ошибке
            параметров. При неверной подписи код прикладной ошибки передается
            внутри контекста страницы, например `RoboxContext.error.code=29`.
          content:
            text/html:
              schema:
                type: string
        "302":
          description: |
            Запрос обработан. В заголовке `Location` возвращается относительный
            URL платежной страницы. Этот ответ не подтверждает создание или
            оплату операции.
          headers:
            Location:
              description: Относительный URL платежной страницы.
              required: true
              schema:
                type: string
                format: uri-reference
                example: /Merchant/Index/01234567-89ab-4cde-8f01-23456789abcd
        default:
          description: Транспортная ошибка запуска платежа.
      x-robokassa-custom-parameters:
        prefix: Shp_
        description: Пользовательские параметры возвращаются в уведомлениях без изменений.
      x-robokassa-signature:
        parameter: SignatureValue
        password: Пароль#1
        holdingFormulaWithoutReceipt: MerchantLogin:OutSum:InvId:true:Пароль#1
        holdingFormulaWithReceipt: MerchantLogin:OutSum:InvId:Receipt:true:Пароль#1
        holdingModifierCondition: Значение true добавляется в строку подписи только при StepByStep=true.
        documentation: https://docs.robokassa.ru/ru/pay-interface#signature
      x-robokassa-environment:
        testSupported: true
        productionSupported: true
        note: Метод работает в тестовом и основном режиме. Тестовый режим включается параметром IsTest=1.

  /Fiscalization.Api.External/Receipt/Register:
    post:
      tags:
        - Fiscalization
      summary: Зарегистрировать чек после оплаты
      description: |
        Регистрирует один или несколько чеков для успешно оплаченных операций.
        Метод используется, если при запуске оплаты был передан
        `IsWithoutFreeSale=true`, а `Receipt` не передавался.

        Payload собирается по схеме `FiscalReceiptRegisterPayload`. Итоговый JWT
        передается в body как JSON-строка. JWT формируется по тем же правилам,
        что и для Invoice API.
      operationId: registerFiscalReceipt
      x-robokassa-authentication:
        type: jwt
        required: true
      servers:
        - url: https://services.robokassa.ru
      requestBody:
        $ref: "#/components/requestBodies/InvoiceJwt"
      responses:
        "200":
          description: Результат регистрации чеков.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiscalReceiptRegisterResponse"
              example:
                IsSuccess: true
                Data:
                  ReceiptRegistrationResults:
                    - IsSuccess: true
                      OpId: 123456789
                      ReceiptId: 987654
                      ReceiptType: Sell
                      Errors: []
                Errors: []
        "400":
          description: JWT или Payload не прошли проверку.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiscalReceiptRegisterResponse"
              example:
                IsSuccess: false
                Errors:
                  - Text: Incorrect JWT
                    Type: ValidationError
        default:
          description: Транспортная ошибка сервиса фискализации.
      x-robokassa-jwt:
        payloadSchema: "#/components/schemas/FiscalReceiptRegisterPayload"
        payloadSchemaRef:
          $ref: "#/components/schemas/FiscalReceiptRegisterPayload"
        secret: MerchantLogin:Пароль#1
        signingInput: BASE64URL_HEADER.BASE64URL_PAYLOAD
        signature: HMAC(signingInput, secret)
        documentation: https://docs.robokassa.ru/ru/deferred-receipt-registration#register-receipt
      externalDocs:
        description: Регистрация чека после оплаты
        url: https://docs.robokassa.ru/ru/deferred-receipt-registration/

  /InvoiceServiceWebApi/api/CreateInvoice:
    post:
      tags:
        - Invoices
      summary: Создать счет
      description: |
        Создает одноразовую или многоразовую ссылку на оплату. Тело запроса —
        подписанный JWT в виде строки. JWT состоит из Header, Payload и Signature.

        Для подписи используется HMAC с выбранным алгоритмом. Секретный ключ
        составляется как `MerchantLogin:Пароль#1`. При создании тестового счета
        с `AdditionalParameters.IsTest=1` используется тестовый Пароль#1, без
        `IsTest` — основной Пароль#1.

        Payload собирается по схеме `InvoiceCreatePayload`. Итоговый JWT
        передается в body как JSON-строка, а не как JSON-объект.
      operationId: createInvoice
      x-robokassa-authentication:
        type: jwt
        required: true
      servers:
        - url: https://services.robokassa.ru
      requestBody:
        $ref: "#/components/requestBodies/InvoiceJwt"
      responses:
        "200":
          description: |
            Результат обработки запроса. Invoice API возвращает HTTP 200 как при
            успешном создании счета, так и при прикладной ошибке. Результат нужно
            определять по полю `isSuccess`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InvoiceCreateSuccess"
                  - $ref: "#/components/schemas/InvoiceError"
              examples:
                success:
                  summary: Счет создан
                  value:
                    id: 01234567-89ab-4cde-8f01-23456789abcd
                    invId: 1234567890
                    url: https://auth.robokassa.ru/merchant/Invoice/AbCdEfGhIjKlMnOpQrStUv
                    isSuccess: true
                malformedRequest:
                  summary: Некорректный JWT
                  value:
                    isSuccess: false
                    message: Некорректно составлен запрос
        default:
          description: Транспортная ошибка Invoice API.
      x-robokassa-jwt:
        payloadSchema: "#/components/schemas/InvoiceCreatePayload"
        payloadSchemaRef:
          $ref: "#/components/schemas/InvoiceCreatePayload"
        secret: MerchantLogin:Пароль#1
        secretSelection:
          test: Тестовый Пароль#1, если AdditionalParameters.IsTest=1.
          production: Основной Пароль#1, если IsTest не передан.
        signingInput: BASE64URL_HEADER.BASE64URL_PAYLOAD
        signature: HMAC(signingInput, secret)
        documentation: https://docs.robokassa.ru/ru/invoice-api#create
      x-robokassa-environment:
        testSupported: true
        productionSupported: true
        note: >-
          Тестовый счет создается при передаче AdditionalParameters.IsTest=1 и
          подписи JWT тестовым Паролем#1.

  /InvoiceServiceWebApi/api/DeactivateInvoice:
    post:
      tags:
        - Invoices
      summary: Деактивировать счет
      description: |
        Деактивирует созданный счет или ссылку. В Payload необходимо передать
        `MerchantLogin` и один из идентификаторов: `EncodedId`, `Id` или `InvId`.

        Payload собирается по схеме `InvoiceDeactivatePayload`. Итоговый JWT
        передается в body как JSON-строка, а не как JSON-объект.
      operationId: deactivateInvoice
      x-robokassa-authentication:
        type: jwt
        required: true
      servers:
        - url: https://services.robokassa.ru
      requestBody:
        $ref: "#/components/requestBodies/InvoiceJwt"
      responses:
        "200":
          description: |
            Результат обработки запроса. Прикладная ошибка, как и успешный
            результат, возвращается с HTTP 200 и определяется по `isSuccess`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InvoiceActionSuccess"
                  - $ref: "#/components/schemas/InvoiceError"
              examples:
                success:
                  value:
                    isSuccess: true
                malformedRequest:
                  summary: Некорректный JWT
                  value:
                    isSuccess: false
                    message: Некорректно составлен запрос
        default:
          description: Транспортная ошибка Invoice API.
      x-robokassa-jwt:
        payloadSchema: "#/components/schemas/InvoiceDeactivatePayload"
        payloadSchemaRef:
          $ref: "#/components/schemas/InvoiceDeactivatePayload"
        secret: MerchantLogin:Пароль#1
        signingInput: BASE64URL_HEADER.BASE64URL_PAYLOAD
        signature: HMAC(signingInput, secret)
        documentation: https://docs.robokassa.ru/ru/invoice-api#deactivate
      x-robokassa-environment:
        testSupported: true
        productionSupported: true
        note: Метод деактивирует как основные, так и тестовые счета.

  /InvoiceServiceWebApi/api/GetInvoiceInformationList:
    post:
      tags:
        - Invoices
      summary: Получить список счетов
      description: |
        Возвращает счета, соответствующие фильтрам из JWT Payload. Ответ содержит
        массив `invoiceInformationList`, общее количество `total` и признак
        `isSuccess`.

        Payload собирается по схеме `InvoiceInformationFilter`. Итоговый JWT
        передается в body как JSON-строка, а не как JSON-объект.
      operationId: listInvoices
      x-robokassa-authentication:
        type: jwt
        required: true
      servers:
        - url: https://services.robokassa.ru
      requestBody:
        $ref: "#/components/requestBodies/InvoiceJwt"
      responses:
        "200":
          description: |
            Результат обработки запроса. Успешный список и прикладная ошибка
            возвращаются с HTTP 200 и различаются по `isSuccess`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InvoiceInformationListResponse"
                  - $ref: "#/components/schemas/InvoiceError"
              examples:
                success:
                  value:
                    invoiceInformationList:
                      - id: 01234567-89ab-4cde-8f01-23456789abcd
                        invId: 1234567890
                        invoiceType: OneTime
                        created: 2026-07-23T09:54:27.010856+00:00
                        modified: 2026-07-23T09:56:54.907627+00:00
                        culture: ru
                        outSum: 1
                        expirationDate: 2026-07-23T09:56:54.907627+00:00
                        description: OpenAPI contract verification
                        invoiceItems: []
                        isCustomerNotificationEmailSent: false
                        invoiceStatus: Expired
                        invoicePaymentUrl: https://auth.robokassa.ru/merchant/Invoice/AbCdEfGhIjKlMnOpQrStUv
                        shortInvoicePaymentUrl: https://auth.robokassa.ru/Merchant/Invoice/AbCdEfGhIjKlMnOpQrStUv
                        aliases: []
                        userFields: {}
                        payments: []
                        isWithoutFreeSale: false
                    total: 1
                    isSuccess: true
                malformedRequest:
                  summary: Некорректный JWT
                  value:
                    isSuccess: false
                    message: Некорректно составлен запрос
        default:
          description: Транспортная ошибка Invoice API.
      x-robokassa-jwt:
        payloadSchema: "#/components/schemas/InvoiceInformationFilter"
        payloadSchemaRef:
          $ref: "#/components/schemas/InvoiceInformationFilter"
        secret: MerchantLogin:Пароль#1
        signingInput: BASE64URL_HEADER.BASE64URL_PAYLOAD
        signature: HMAC(signingInput, secret)
        documentation: https://docs.robokassa.ru/ru/invoice-api#status
      x-robokassa-environment:
        testSupported: true
        productionSupported: true
        note: Метод возвращает как основные, так и тестовые счета.

  /InvoiceServiceWebApi/api/GetInvoiceInformation:
    post:
      tags:
        - Invoices
      summary: Получить информацию о счете
      description: |
        Возвращает один счет по внутреннему `Id` или номеру магазина `InvId`.
        Payload собирается по схеме `InvoiceInformationPayload`. Итоговый JWT
        передается в body как JSON-строка, а не как JSON-объект.
      operationId: getInvoiceInformation
      x-robokassa-authentication:
        type: jwt
        required: true
      servers:
        - url: https://services.robokassa.ru
      requestBody:
        $ref: "#/components/requestBodies/InvoiceJwt"
      responses:
        "200":
          description: |
            Успешный результат и прикладная ошибка возвращаются с HTTP 200 и
            различаются по `isSuccess`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InvoiceInformationSuccess"
                  - $ref: "#/components/schemas/InvoiceError"
              examples:
                success:
                  value:
                    invoiceInformation:
                      id: 01234567-89ab-4cde-8f01-23456789abcd
                      invId: 851
                      invoiceType: OneTime
                      created: 2026-08-10T10:00:00+00:00
                      modified: 2026-08-10T10:01:00+00:00
                      merchantLogin: robo-demo-test
                      culture: ru
                      outSum: 100
                      description: Оплата заказа 851
                      invoiceStatus: NotPaid
                      aliases:
                        - BankCard
                        - SBP
                      userFields: {}
                      payments: []
                      isWithoutFreeSale: false
                    isSuccess: true
                malformedRequest:
                  summary: Некорректный JWT
                  value:
                    isSuccess: false
                    message: Некорректно составлен запрос
        default:
          description: Транспортная ошибка Invoice API.
      x-robokassa-jwt:
        payloadSchema: "#/components/schemas/InvoiceInformationPayload"
        payloadSchemaRef:
          $ref: "#/components/schemas/InvoiceInformationPayload"
        secret: MerchantLogin:Пароль#1
        signingInput: BASE64URL_HEADER.BASE64URL_PAYLOAD
        signature: HMAC(signingInput, secret)
        documentation: https://docs.robokassa.ru/ru/invoice-api#get-invoice-information
      x-robokassa-environment:
        testSupported: true
        productionSupported: true
        note: Метод возвращает информацию как об основных, так и о тестовых счетах.

  /InvoiceServiceWebApi/api/NotifyCustomer:
    post:
      tags:
        - Invoices
      summary: Отправить уведомление покупателю
      description: |
        Отправляет покупателю email-уведомление о счете. Payload собирается по
        схеме `InvoiceNotificationPayload`. Итоговый JWT передается в body как
        JSON-строка, а не как JSON-объект.
      operationId: notifyInvoiceCustomer
      x-robokassa-authentication:
        type: jwt
        required: true
      servers:
