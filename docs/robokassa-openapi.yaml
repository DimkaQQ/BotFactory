    OperationStateResponse:
      type: object
      xml:
        name: OperationStateResponse
        namespace: http://merchant.roboxchange.com/WebService/
      required:
        - Result
      properties:
        Result:
          $ref: "#/components/schemas/OperationResult"
        State:
          $ref: "#/components/schemas/OperationState"
        Info:
          $ref: "#/components/schemas/OperationInfo"
        UserFields:
          $ref: "#/components/schemas/OperationUserFields"

    OperationResult:
      type: object
      required:
        - Code
      properties:
        Code:
          type: integer
          enum:
            - 0
            - 1
            - 2
            - 3
            - 4
            - 1000
        Description:
          type: string

    OperationState:
      type: object
      properties:
        Code:
          type: integer
          description: |
            Код состояния операции. Для холдов:
            - `20` — операция находится в HOLD;
            - `50` — идет обработка операции;
            - `60` — зачисление отменено, деньги возвращены покупателю;
            - `100` — операция успешно подтверждена.
          enum:
            - 5
            - 10
            - 20
            - 50
            - 60
            - 80
            - 100
          x-robokassa-state-descriptions:
            "10": >-
              Операция отменена, деньги от покупателя не были получены. Оплата не
              была произведена. Покупатель отказался от оплаты или не совершил
              платеж, и операция отменилась по истечении времени ожидания. Либо
              платёж был совершён после истечения времени ожидания. В случае
              возникновения спорных моментов по запросу от продавца или покупателя,
              операция будет перепроверена службой поддержки, и в зависимости от
              результата может быть переведена в другое состояние.
            "20": Операция находится в HOLD.
            "50": Идет обработка операции.
            "60": Зачисление отменено, деньги возвращены покупателю.
            "100": Операция успешно подтверждена.
        RequestDate:
          type: string
          format: date-time
        StateDate:
          type: string
          format: date-time

